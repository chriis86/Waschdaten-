      - name: APK bauen
        working-directory: projekt
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Waschkonto.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Waschkonto-APK
          path: Waschkonto.apk

      - name: APK als Release veröffentlichen (direkter Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Waschkonto App 1.${{ github.run_number }}
          files: Waschkonto.apk
