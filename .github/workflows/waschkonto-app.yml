# Waschkonto-App: baut automatisch die Android-APK.
# Nur diese eine Datei wird gebraucht – das komplette App-Projekt wird beim Bauen erzeugt.
name: Waschkonto APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: App-Projekt erzeugen
        run: |
          set -e
          mkdir -p projekt && cd projekt
          cat > settings.gradle <<'ENDE_DER_DATEI'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Waschkonto"
          include ':app'
          ENDE_DER_DATEI
          cat > build.gradle <<'ENDE_DER_DATEI'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ENDE_DER_DATEI
          cat > gradle.properties <<'ENDE_DER_DATEI'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          ENDE_DER_DATEI
          mkdir -p app
          cat > app/build.gradle <<'ENDE_DER_DATEI'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'de.waschkonto.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'de.waschkonto.app'
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
                  versionName "1." + (System.getenv('VERSION_CODE') ?: '0')
              }
              signingConfigs {
                  fest {
                      storeFile file('waschkonto.jks')
                      storePassword 'waschkonto'
                      keyAlias 'waschkonto'
                      keyPassword 'waschkonto'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fest
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ENDE_DER_DATEI
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ENDE_DER_DATEI'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Waschkonto"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="true"
                  android:theme="@style/Theme.Waschkonto">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDE_DER_DATEI
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'ENDE_DER_DATEI'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_hintergrund">#1565C0</color>
              <style name="Theme.Waschkonto" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:colorPrimary">#1565C0</item>
                  <item name="android:colorPrimaryDark">#0D47A1</item>
                  <item name="android:colorAccent">#1E88E5</item>
                  <item name="android:statusBarColor">#0D47A1</item>
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          ENDE_DER_DATEI
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'ENDE_DER_DATEI'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_hintergrund" />
              <foreground android:drawable="@drawable/ic_vordergrund" />
          </adaptive-icon>
          ENDE_DER_DATEI
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_vordergrund.xml <<'ENDE_DER_DATEI'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,28 C54,28 37,48 37,61 A17,17 0 0,0 71,61 C71,48 54,28 54,28 Z" />
              <path android:fillColor="#90CAF9"
                  android:pathData="M46,60 A8,8 0 0,0 54,70 L54,73 A11,11 0 0,1 43,60 Z" />
              <path android:fillColor="#FFFFFF"
                  android:pathData="M73,36 A4,4 0 1,1 72.99,36 Z M79,48 A2.5,2.5 0 1,1 78.99,48 Z M33,40 A3,3 0 1,1 32.99,40 Z" />
          </vector>
          ENDE_DER_DATEI
          mkdir -p app/src/main/java/de/waschkonto/app
          cat > app/src/main/java/de/waschkonto/app/MainActivity.java <<'ENDE_DER_DATEI'
          package de.waschkonto.app;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.text.InputType;
          import android.util.Base64;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          
          public class MainActivity extends Activity {
          
              private static final String PREFS = "einstellungen";
              private static final String KEY_URL = "server_url";
              private static final int REQ_DATEI = 1;
          
              private WebView web;
              private ValueCallback<Uri[]> dateiCallback;
              private boolean fehlerSeite = false;
              private boolean verlaufLoeschen = false;
          
              // ---------------------------------------------------------------- Start
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  web = new WebView(this);
                  setContentView(web);
                  einrichtenWebView();
          
                  String url = serverUrl();
                  if (url == null) {
                      adresseDialog(true);
                  } else if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      laden();
                  }
              }
          
              private void einrichtenWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  // Schriftgröße nicht über die System-Schriftgröße aufblähen (sonst wird die Seite zu breit)
                  s.setTextZoom(100);
                  // Erkennungsmerkmal, falls der Server die App vom Browser unterscheiden will
                  s.setUserAgentString(s.getUserAgentString() + " WaschkontoApp/1.0");
          
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
          
                  web.addJavascriptInterface(new Bruecke(), "WaschkontoApp");
          
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return externOeffnen(request.getUrl());
                      }
          
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              zeigeFehler(String.valueOf(error.getDescription()));
                          }
                      }
          
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          CookieManager.getInstance().flush();
                          if (verlaufLoeschen && !fehlerSeite) {
                              verlaufLoeschen = false;
                              web.clearHistory();
                          }
                          if (!fehlerSeite) {
                              view.evaluateJavascript(HILFS_SKRIPT, null);
                          }
                      }
                  });
          
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (dateiCallback != null) dateiCallback.onReceiveValue(null);
                          dateiCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), REQ_DATEI);
                          } catch (ActivityNotFoundException e) {
                              dateiCallback = null;
                              Toast.makeText(MainActivity.this, "Keine Datei-Auswahl verfügbar", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }
                  });
          
                  // Downloads (z.B. CSV/PDF-Export vom Server)
                  web.setDownloadListener((url, userAgent, contentDisposition, mimeType, length) -> {
                      if (url.startsWith("blob:") || url.startsWith("data:")) {
                          // wird normalerweise schon vom Hilfs-Skript abgefangen
                          String name = URLUtil.guessFileName(url, contentDisposition, mimeType);
                          web.evaluateJavascript("window.__wkSpeichern && window.__wkSpeichern("
                                  + jsText(url) + "," + jsText(name) + ")", null);
                      } else {
                          httpDownload(url, contentDisposition, mimeType);
                      }
                  });
              }
          
              /** true = nicht in der App laden (externer Link), false = in der App laden */
              private boolean externOeffnen(Uri uri) {
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
                  if (scheme.equals("http") || scheme.equals("https")) {
                      String su = serverUrl();
                      if (su == null) return false;
                      Uri server = Uri.parse(su);
                      String h1 = uri.getHost() == null ? "" : uri.getHost();
                      String h2 = server.getHost() == null ? "" : server.getHost();
                      if (h1.equalsIgnoreCase(h2)) return false; // eigener Server
                  } else if (scheme.equals("about") || scheme.equals("data") || scheme.equals("blob")
                          || scheme.equals("javascript")) {
                      return false;
                  }
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(this, "Kein passendes Programm gefunden", Toast.LENGTH_SHORT).show();
                  }
                  return true;
              }
          
              // ---------------------------------------------------------------- Server-Adresse
          
              private String serverUrl() {
                  return getSharedPreferences(PREFS, MODE_PRIVATE).getString(KEY_URL, null);
              }
          
              private void laden() {
                  String url = serverUrl();
                  if (url == null) {
                      adresseDialog(true);
                      return;
                  }
                  fehlerSeite = false;
                  verlaufLoeschen = true;
                  web.loadUrl(url);
              }
          
              private static String normalisieren(String eingabe) {
                  String s = eingabe.trim().replace(" ", "");
                  if (s.isEmpty()) return null;
                  if (!s.matches("(?i)^https?://.*")) s = "http://" + s;
                  while (s.endsWith("/") && s.length() > 8) s = s.substring(0, s.length() - 1);
                  Uri u = Uri.parse(s);
                  if (u.getHost() == null || u.getHost().isEmpty()) return null;
                  return s;
              }
          
              private void adresseDialog(boolean ersterStart) {
                  int pad = (int) (20 * getResources().getDisplayMetrics().density);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(pad, pad / 2, pad, 0);
          
                  TextView info = new TextView(this);
                  info.setText("Adresse des Waschkonto-Servers (Raspberry Pi) eingeben – "
                          + "genau wie im Browser, z.B.\n192.168.178.50:5000");
                  box.addView(info);
          
                  EditText feld = new EditText(this);
                  feld.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  feld.setSingleLine(true);
                  feld.setHint("192.168.178.50:5000");
                  String alt = serverUrl();
                  if (alt != null) {
                      feld.setText(alt);
                      feld.setSelection(alt.length());
                  }
                  box.addView(feld);
          
                  AlertDialog.Builder b = new AlertDialog.Builder(this)
                          .setTitle(ersterStart ? "Willkommen bei Waschkonto" : "Server-Adresse")
                          .setView(box)
                          .setCancelable(!ersterStart)
                          .setPositiveButton("Verbinden", null);
                  if (!ersterStart) b.setNegativeButton("Abbrechen", null);
                  else b.setNegativeButton("Beenden", (d, w) -> finish());
          
                  AlertDialog dlg = b.create();
                  dlg.setOnShowListener(d -> dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> {
                      String url = normalisieren(feld.getText().toString());
                      if (url == null) {
                          feld.setError("Bitte gültige Adresse eingeben");
                          return;
                      }
                      getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString(KEY_URL, url).apply();
                      dlg.dismiss();
                      laden();
                  }));
                  dlg.show();
              }
          
              // ---------------------------------------------------------------- Fehlerseite
          
              private void zeigeFehler(String grund) {
                  fehlerSeite = true;
                  String url = serverUrl() == null ? "" : serverUrl();
                  String html = "<!DOCTYPE html><html><head><meta charset='utf-8'>"
                          + "<meta name='viewport' content='width=device-width,initial-scale=1'>"
                          + "<style>body{font-family:sans-serif;background:#f2f5fa;color:#223;margin:0;"
                          + "display:flex;align-items:center;justify-content:center;min-height:100vh}"
                          + ".k{background:#fff;border-radius:16px;padding:28px 22px;margin:16px;max-width:420px;"
                          + "box-shadow:0 4px 18px rgba(0,0,0,.08);text-align:center}"
                          + "h2{margin:.3em 0;color:#0d47a1}.u{font-family:monospace;background:#eef2f8;"
                          + "padding:6px 10px;border-radius:8px;display:inline-block;word-break:break-all}"
                          + "ul{text-align:left;line-height:1.6;padding-left:20px}"
                          + "button{display:block;width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;"
                          + "font-size:16px;font-weight:bold}.p{background:#1565c0;color:#fff}.s{background:#e3e9f3;color:#0d47a1}"
                          + "small{color:#889}</style></head><body><div class='k'>"
                          + "<div style='font-size:52px'>📡</div><h2>Server nicht erreichbar</h2>"
                          + "<p><span class='u'>" + htmlText(url) + "</span></p>"
                          + "<ul><li>Ist das Handy im selben WLAN wie der Raspberry Pi?</li>"
                          + "<li>Ist der Raspberry Pi eingeschaltet?</li>"
                          + "<li>Läuft der Waschkonto-Server?</li></ul>"
                          + "<button class='p' onclick='WaschkontoApp.neuLaden()'>Erneut versuchen</button>"
                          + "<button class='s' onclick='WaschkontoApp.adresseAendern()'>Server-Adresse ändern</button>"
                          + "<p><small>" + htmlText(grund) + "</small></p></div></body></html>";
                  web.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              }
          
              // ---------------------------------------------------------------- Zurück-Taste / Menü
          
              @Override
              public void onBackPressed() {
                  if (!fehlerSeite && web.canGoBack()) {
                      web.goBack();
                      return;
                  }
                  menue();
              }
          
              private void menue() {
                  String[] punkte = {"Neu laden", "Server-Adresse ändern", "App beenden"};
                  new AlertDialog.Builder(this)
                          .setTitle("Waschkonto")
                          .setItems(punkte, (d, i) -> {
                              if (i == 0) laden();
                              else if (i == 1) adresseDialog(false);
                              else finish();
                          })
                          .show();
              }
          
              // ---------------------------------------------------------------- Lebenszyklus
          
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (!fehlerSeite) web.saveState(outState);
              }
          
              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
                  CookieManager.getInstance().flush();
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }
          
              @Override
              protected void onDestroy() {
                  web.destroy();
                  super.onDestroy();
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_DATEI && dateiCallback != null) {
                      dateiCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      dateiCallback = null;
                  }
              }
          
              // ---------------------------------------------------------------- Dateien speichern
          
              private void httpDownload(String url, String contentDisposition, String mimeType) {
                  Toast.makeText(this, "Download läuft …", Toast.LENGTH_SHORT).show();
                  String ua = web.getSettings().getUserAgentString();
                  new Thread(() -> {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          String cookies = CookieManager.getInstance().getCookie(url);
                          if (cookies != null) c.setRequestProperty("Cookie", cookies);
                          c.setRequestProperty("User-Agent", ua);
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(60000);
                          String cd = c.getHeaderField("Content-Disposition");
                          if (cd == null) cd = contentDisposition;
                          String mime = c.getContentType();
                          if (mime == null) mime = mimeType;
                          if (mime != null && mime.contains(";")) mime = mime.substring(0, mime.indexOf(';')).trim();
                          ByteArrayOutputStream buf = new ByteArrayOutputStream();
                          try (InputStream in = c.getInputStream()) {
                              byte[] b = new byte[8192];
                              int n;
                              while ((n = in.read(b)) > 0) buf.write(b, 0, n);
                          }
                          c.disconnect();
                          speichern(buf.toByteArray(), URLUtil.guessFileName(url, cd, mime), mime);
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "Download fehlgeschlagen: " + e.getMessage(),
                                  Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }
          
              /** Läuft im Hintergrund-Thread. */
              private void speichern(byte[] daten, String name, String mime) {
                  if (name == null || name.trim().isEmpty()) name = "waschkonto-datei";
                  name = name.replaceAll("[\\\\/:*?\"<>|]", "_");
                  if (mime == null || mime.isEmpty()) mime = "application/octet-stream";
                  try {
                      Uri ziel;
                      String ort;
                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentResolver cr = getContentResolver();
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime);
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Waschkonto");
                          ziel = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (ziel == null) throw new Exception("Speicherort nicht verfügbar");
                          try (OutputStream os = cr.openOutputStream(ziel)) {
                              os.write(daten);
                          }
                          ort = "Downloads/Waschkonto/" + name;
                      } else {
                          File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          dir.mkdirs();
                          File f = new File(dir, name);
                          try (FileOutputStream os = new FileOutputStream(f)) {
                              os.write(daten);
                          }
                          ziel = null;
                          ort = f.getAbsolutePath();
                      }
                      final Uri uri = ziel;
                      final String m = mime;
                      runOnUiThread(() -> {
                          AlertDialog.Builder b = new AlertDialog.Builder(this)
                                  .setTitle("Gespeichert")
                                  .setMessage(ort)
                                  .setNegativeButton("OK", null);
                          if (uri != null) {
                              b.setPositiveButton("Öffnen", (d, w) -> {
                                  Intent i = new Intent(Intent.ACTION_VIEW);
                                  i.setDataAndType(uri, m);
                                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  try {
                                      startActivity(i);
                                  } catch (ActivityNotFoundException e) {
                                      Toast.makeText(this, "Keine App zum Öffnen gefunden", Toast.LENGTH_SHORT).show();
                                  }
                              });
                          }
                          b.show();
                      });
                  } catch (Exception e) {
                      runOnUiThread(() -> Toast.makeText(this, "Speichern fehlgeschlagen: " + e.getMessage(),
                              Toast.LENGTH_LONG).show());
                  }
              }
          
              // ---------------------------------------------------------------- JavaScript-Brücke
          
              private class Bruecke {
                  @JavascriptInterface
                  public void neuLaden() {
                      runOnUiThread(MainActivity.this::laden);
                  }
          
                  @JavascriptInterface
                  public void adresseAendern() {
                      runOnUiThread(() -> adresseDialog(false));
                  }
          
                  @JavascriptInterface
                  public void dateiSpeichern(String dataUrl, String name, String mime) {
                      try {
                          int komma = dataUrl.indexOf(',');
                          String kopf = dataUrl.substring(0, komma);
                          String inhalt = dataUrl.substring(komma + 1);
                          byte[] daten = kopf.contains(";base64")
                                  ? Base64.decode(inhalt, Base64.DEFAULT)
                                  : Uri.decode(inhalt).getBytes("UTF-8");
                          if ((mime == null || mime.isEmpty()) && kopf.startsWith("data:")) {
                              mime = kopf.substring(5).split(";")[0];
                          }
                          speichern(daten, name, mime);
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this,
                                  "Speichern fehlgeschlagen", Toast.LENGTH_LONG).show());
                      }
                  }
          
                  @JavascriptInterface
                  public void drucken() {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                          String titel = web.getTitle() == null || web.getTitle().isEmpty() ? "Waschkonto" : web.getTitle();
                          pm.print(titel, web.createPrintDocumentAdapter(titel),
                                  new PrintAttributes.Builder().setMediaSize(PrintAttributes.MediaSize.ISO_A4).build());
                      });
                  }
              }
          
              /** Wird nach jedem Seitenaufruf eingefügt: Export-Downloads (blob/data) und window.print() */
              private static final String HILFS_SKRIPT =
                      "(function(){if(window.__wkHook)return;window.__wkHook=true;" +
                      // Seitenbreite an den Bildschirm anpassen, kein seitliches Scrollen
                      "var vp=document.querySelector('meta[name=viewport]');if(!vp){vp=document.createElement('meta');" +
                      "vp.name='viewport';(document.head||document.documentElement).appendChild(vp);}" +
                      "if(!vp.content)vp.content='width=device-width,initial-scale=1';" +
                      "window.__wkSpeichern=function(h,n){fetch(h).then(function(r){return r.blob();}).then(function(b){" +
                      "var fr=new FileReader();fr.onload=function(){WaschkontoApp.dateiSpeichern(fr.result,n||'datei',b.type||'');};" +
                      "fr.readAsDataURL(b);});};" +
                      "function pr(a){var h=a.href||'';if(h.indexOf('blob:')===0||h.indexOf('data:')===0){" +
                      "window.__wkSpeichern(h,a.getAttribute('download')||'datei');return true;}return false;}" +
                      "var oc=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){" +
